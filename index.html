<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sevgililer Günü Mektubu</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap">
<style>
:root{
  --bg:#ffe9ec; --bg2:#fff6f0; --rose:#e8506a; --wine:#5a1631; --amber:#ffb84d; --win:#ffc9d3; --ink:#5a1631;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--bg:#2a0d1a; --bg2:#3a1224; --rose:#ff6f8a; --wine:#ffd9e0; --amber:#ffc266; --win:#6a1f3a; --ink:#ffe3e8; color-scheme:dark;}
}
:root[data-theme="dark"]{--bg:#2a0d1a; --bg2:#3a1224; --rose:#ff6f8a; --wine:#ffd9e0; --amber:#ffc266; --win:#6a1f3a; --ink:#ffe3e8; color-scheme:dark;}
*{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);
  font-family:"Press Start 2P","Courier New",ui-monospace,monospace;overflow:hidden;
  display:grid;place-items:center;height:100%}
#rain{position:fixed;inset:0;pointer-events:none;overflow:hidden}
#rain i{position:absolute;top:-30px;color:var(--rose);opacity:.55;animation:fall linear infinite}
@keyframes fall{to{transform:translateY(110vh) rotate(25deg)}}
main{position:relative;z-index:1;width:min(92vw,420px);text-align:center}
.hint{font-size:11px;line-height:1.8;margin-top:18px}
/* zarf */
#envelope{all:unset;cursor:pointer;display:block;margin:0 auto;width:150px;transition:transform .15s}
#envelope:hover{transform:translateY(-4px)}
#envelope:focus-visible,.btn:focus-visible{outline:3px solid var(--amber);outline-offset:4px}
#envelope svg{width:100%;display:block;image-rendering:pixelated;animation:bob 2s steps(4) infinite}
@keyframes bob{50%{transform:translateY(-6px)}}
/* pencere */
#win{display:none;border:4px solid var(--rose);background:var(--win);box-shadow:6px 6px 0 var(--rose);text-align:left}
#win.open{display:block;animation:pop .35s steps(5)}
@keyframes pop{from{transform:scale(.3);opacity:0}to{transform:scale(1);opacity:1}}
.bar{display:flex;justify-content:space-between;align-items:center;background:var(--rose);color:#fff;padding:8px 10px;font-size:12px}
.hearts{display:flex;justify-content:space-around;padding:12px 0 4px;color:var(--rose);font-size:22px}
.body{margin:10px;background:var(--bg2);border:3px solid var(--rose);padding:22px 14px;text-align:center}
.q{font-size:13px;line-height:1.9;margin:0 0 16px}
.big{width:84px;margin:0 auto 18px;display:block}
.buttons{display:flex;justify-content:center;gap:22px}
.btn{font:inherit;font-size:13px;padding:12px 18px;border:3px solid var(--rose);background:var(--bg2);color:var(--ink);cursor:pointer;box-shadow:3px 3px 0 var(--rose)}
.btn:active{transform:translate(3px,3px);box-shadow:none}
.yes{background:var(--rose);color:#fff}
#no{transition:left .12s,top .12s}
#note{font-size:10px;line-height:1.8;min-height:20px;margin-top:16px}
/* kutlama */
#yay{display:none}
#yay h1{font-size:15px;line-height:1.9;margin:6px 0 12px}
#yay p{font-size:11px;line-height:2;margin:0}
.pop{position:fixed;pointer-events:none;z-index:5;font-size:22px;animation:burst 1.4s ease-out forwards}
@keyframes burst{to{transform:translate(var(--x),var(--y)) scale(1.4);opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="rain" aria-hidden="true"></div>
<main>
  <button id="envelope" aria-label="Mektubu aç">
    <svg viewBox="0 0 16 12" shape-rendering="crispEdges" aria-hidden="true">
      <rect x="1" y="1" width="14" height="10" fill="#ffd9a0" stroke="#e8663a" stroke-width="1"/>
      <path d="M1.5 1.5 L8 7 L14.5 1.5" fill="none" stroke="#e8663a" stroke-width="1"/>
      <rect x="7" y="5" width="2" height="2" fill="#e8304a"/>
    </svg>
  </button>
  <p class="hint" id="hint">♡ Senin için bir mektup var ♡</p>

  <section id="win" aria-live="polite">
    <div class="bar"><span>AŞK.EXE</span><span aria-hidden="true">– ▢ ✕</span></div>
    <div class="hearts" aria-hidden="true"><span>♥</span><span>♥</span><span>♥</span></div>
    <div class="body">
      <div id="ask">
        <p class="q">Benimle Sevgililer Günü’nü geçirir misin?</p>
        <svg class="big" viewBox="0 0 12 11" shape-rendering="crispEdges" aria-hidden="true">
          <path d="M2 1h3v1h2V1h3v1h1v3h-1v1h-1v1h-1v1h-1v1H6v-1H5V9H4V8H3V7H2V6H1V2h1z" fill="#e8304a"/>
          <rect x="3" y="2" width="1" height="1" fill="#fff" opacity=".7"/>
        </svg>
        <div class="buttons">
          <button class="btn yes" id="yes">EVET</button>
          <button class="btn" id="no">HAYIR</button>
        </div>
        <p id="note"></p>
      </div>
      <div id="yay">
        <h1>Biliyordum! ♥</h1>
        <p>Bu akşam sana bir sürpriz var.<br>Şimdi gidip hazırlanma zamanı.</p>
      </div>
    </div>
  </section>
</main>

<script>
(function(){
  var rain=document.getElementById('rain');
  for(var i=0;i<26;i++){
    var h=document.createElement('i');h.textContent='♥';
    h.style.left=Math.random()*100+'%';
    h.style.fontSize=(8+Math.random()*14)+'px';
    h.style.animationDuration=(7+Math.random()*9)+'s';
    h.style.animationDelay=(-Math.random()*12)+'s';
    rain.appendChild(h);
  }
  var env=document.getElementById('envelope'),hint=document.getElementById('hint'),
      win=document.getElementById('win'),no=document.getElementById('no'),
      yes=document.getElementById('yes'),note=document.getElementById('note');

  env.addEventListener('click',function(){
    env.style.display='none';hint.style.display='none';win.classList.add('open');
  });

  var lines=['Emin misin?','Bir daha düşün!','Bu butona basılmaz :)','Yakaladın sandın, değil mi?','Evet’e bas artık!','Kalbimi kırıyorsun…'];
  var tries=0;
  function dodge(e){
    if(e&&e.preventDefault)e.preventDefault();
    var pad=10,w=no.offsetWidth,h=no.offsetHeight;
    no.style.position='fixed';
    no.style.left=pad+Math.random()*(window.innerWidth-w-2*pad)+'px';
    no.style.top=pad+Math.random()*(window.innerHeight-h-2*pad)+'px';
    note.textContent=lines[tries%lines.length];tries++;
    var s=Math.min(1+tries*.12,2);yes.style.transform='scale('+s+')';
  }
  no.addEventListener('mouseenter',dodge);
  no.addEventListener('touchstart',dodge,{passive:false});
  no.addEventListener('click',dodge);

  yes.addEventListener('click',function(){
    document.getElementById('ask').style.display='none';
    document.getElementById('yay').style.display='block';
    no.style.display='none';
    var r=yes.getBoundingClientRect();
    for(var i=0;i<40;i++){
      var p=document.createElement('span');p.className='pop';
      p.textContent=['♥','💖','✨','💘'][i%4];
      p.style.left=window.innerWidth/2+'px';p.style.top=window.innerHeight/2+'px';
      p.style.setProperty('--x',(Math.random()*2-1)*window.innerWidth*.6+'px');
      p.style.setProperty('--y',(Math.random()*2-1)*window.innerHeight*.6+'px');
      document.body.appendChild(p);
      setTimeout(function(el){el.remove()},1500,p);
    }
  });
})();
</script>
</body>
</html>
